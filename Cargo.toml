[package]
name = "fedora-driver-manager"
version = "0.1.2"
edition = "2021"
description = "Comprehensive hardware driver and firmware manager for Fedora Workstation"
authors = ["Shridhar Sabat"]
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
regex = "1.10"
